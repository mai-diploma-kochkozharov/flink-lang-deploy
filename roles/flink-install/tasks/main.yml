---
# ── 1. Check base directory exists ───────────────────────
- name: Check that base directory exists
  stat:
    path: "{{ flink_base_dir }}"
  register: base_dir

- name: Fail if base directory does not exist
  fail:
    msg: >
      Base directory {{ flink_base_dir }} does not exist.
      Please create it before running the playbook.
  when: not base_dir.stat.exists

# ── 2. Copy and unpack archive ────────────────────────────
- name: Check if Flink is already unpacked
  stat:
    path: "{{ flink_home }}/bin/flink"
  register: flink_binary

- name: Copy Flink archive to host
  copy:
    src: "{{ flink_archive_src }}"
    dest: "/tmp/{{ flink_archive }}"
    mode: "0644"
  when: not flink_binary.stat.exists

- name: Unpack Flink archive
  unarchive:
    src: "/tmp/{{ flink_archive }}"
    dest: "{{ flink_base_dir }}"
    remote_src: true
    creates: "{{ flink_home }}/bin/flink"

- name: Ensure correct directory structure
  file:
    path: "{{ flink_home }}"
    state: directory
    mode: "0755"

# ── 3. Deploy configuration ──────────────────────────────
- name: Deploy config.yaml
  template:
    src: flink-conf.yaml.j2
    dest: "{{ flink_home }}/conf/config.yaml"
    mode: "0644"
    backup: true
  notify: restart flink component

- name: Deploy masters file
  template:
    src: masters.j2
    dest: "{{ flink_home }}/conf/masters"
    mode: "0644"
  notify: restart flink component

- name: Deploy workers file
  template:
    src: workers.j2
    dest: "{{ flink_home }}/conf/workers"
    mode: "0644"
  notify: restart flink component

# ── 4. Create log directory ──────────────────────────────
- name: Ensure log directory exists
  file:
    path: "{{ flink_log_dir }}"
    state: directory
    mode: "0755"

# ── 5. S3 (Ozone) filesystem plugin ──────────────────────
# На нодах кластера нет интернета: сначала качаем jar на контроллер в files/,
# затем копируем с локальной тачки на все ноды.
- name: Download flink-s3-fs-hadoop plugin to local files/ (controller)
  get_url:
    url: "https://repo1.maven.org/maven2/org/apache/flink/flink-s3-fs-hadoop/{{ flink_version }}/flink-s3-fs-hadoop-{{ flink_version }}.jar"
    dest: "{{ playbook_dir }}/../files/flink-s3-fs-hadoop-{{ flink_version }}.jar"
    mode: "0644"
  delegate_to: localhost
  run_once: true
  when: flink_s3_enabled | bool

- name: Ensure s3-fs-hadoop plugin directory exists
  file:
    path: "{{ flink_home }}/plugins/s3-fs-hadoop"
    state: directory
    mode: "0755"
  when: flink_s3_enabled | bool

- name: Copy flink-s3-fs-hadoop plugin to cluster node
  copy:
    src: "{{ playbook_dir }}/../files/flink-s3-fs-hadoop-{{ flink_version }}.jar"
    dest: "{{ flink_home }}/plugins/s3-fs-hadoop/flink-s3-fs-hadoop-{{ flink_version }}.jar"
    mode: "0644"
  when: flink_s3_enabled | bool

# ── 6. Hadoop-uber JAR в lib/ (self-contained hadoop classes) ──
# На нодах без системного hadoop (lang33) flink-s3-fs-hadoop плагину нечего
# подтянуть через HADOOP_CLASSPATH. Кладём uber-jar в $FLINK_HOME/lib/ —
# он берётся в classpath Flink автоматически.
- name: Download flink-shaded-hadoop-2-uber to controller files/
  get_url:
    url: "{{ flink_hadoop_uber_url }}"
    dest: "{{ playbook_dir }}/../files/{{ flink_hadoop_uber_jar }}"
    mode: "0644"
  delegate_to: localhost
  run_once: true
  when: flink_hadoop_uber_enabled | bool

- name: Copy flink-shaded-hadoop-2-uber to cluster node lib/
  copy:
    src: "{{ playbook_dir }}/../files/{{ flink_hadoop_uber_jar }}"
    dest: "{{ flink_home }}/lib/{{ flink_hadoop_uber_jar }}"
    mode: "0644"
  when: flink_hadoop_uber_enabled | bool
  notify: restart flink component

- name: Clean up archive from /tmp
  file:
    path: "/tmp/{{ flink_archive }}"
    state: absent

# ── 7. Lumina-jni (Aliyun DiskANN native binary) ────────────────────────
# paimon-lumina (DiskANN) использует Aliyun lumina-jni-0.1.0.jar с native
# .so файлами (linux/amd64/{libstdc++.so.6, liblumina.so, liblumina_jni.so}).
# Не на Maven Central — только в Aliyun OSS репо.
#
# Aliyun NativeLibraryLoader при load извлекает их в /tmp и пытается
# `System.load(libstdc++)` ПЕРЕД `System.load(liblumina_jni)`. Но в JDK 17
# System.load использует dlopen с RTLD_LOCAL → preloaded libstdc++ symbols
# не видны при resolve dependencies liblumina.so → ld linker идёт в system
# /lib64/libstdc++.so.6 (RHEL 8 → max GLIBCXX_3.4.25) → fail на GLIBCXX_3.4.26.
#
# Workaround: распаковать bundled .so в постоянный каталог и прокинуть
# LD_LIBRARY_PATH в env Flink-процессов (см. start.yml + config-update.yml).
# Тогда ld linker найдёт правильную libstdc++ при resolve, без зависимости
# от RTLD_LOCAL.

- name: Download lumina-jni to controller files/
  get_url:
    url: "{{ flink_lumina_url }}"
    dest: "{{ playbook_dir }}/../files/{{ flink_lumina_jar }}"
    mode: "0644"
  delegate_to: localhost
  run_once: true
  when: flink_lumina_enabled | bool

- name: Copy lumina-jni to cluster node lib/
  copy:
    src: "{{ playbook_dir }}/../files/{{ flink_lumina_jar }}"
    dest: "{{ flink_home }}/lib/{{ flink_lumina_jar }}"
    mode: "0644"
  when: flink_lumina_enabled | bool
  notify: restart flink component

- name: Extract bundled lumina native libs
  # Aliyun jar содержит linux/amd64/{libstdc++.so.6, liblumina.so, liblumina_jni.so}
  # — все нужны для DiskANN. unzip -j флэтит структуру (без linux/amd64/ prefix).
  shell: |
    set -eu
    JAR="{{ flink_home }}/lib/{{ flink_lumina_jar }}"
    NATIVE_DIR="{{ flink_home }}/lib/native/linux/amd64"
    mkdir -p "$NATIVE_DIR"
    if command -v unzip >/dev/null 2>&1; then
      unzip -o -j "$JAR" 'linux/amd64/*' -d "$NATIVE_DIR"
    else
      # fallback: jar tool из JDK
      cd "$NATIVE_DIR"
      "{{ flink_java_home }}/bin/jar" xf "$JAR" linux/amd64
      mv linux/amd64/* . 2>/dev/null || true
      rmdir linux/amd64 linux 2>/dev/null || true
    fi
    chmod 0755 "$NATIVE_DIR"/*.so* || true
  args:
    creates: "{{ flink_home }}/lib/native/linux/amd64/liblumina_jni.so"
  when: flink_lumina_enabled | bool
  notify: restart flink component