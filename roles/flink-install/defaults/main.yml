# ── Paths ──────────────────────────────────────────────
flink_base_dir: /opt/flink-ivkochkozharov
flink_version: "2.2.0"
flink_home: "{{ flink_base_dir }}/flink-{{ flink_version }}"
flink_archive: "flink-{{ flink_version }}-bin-scala_2.12.tgz"
flink_archive_src: "{{ playbook_dir }}/../files/{{ flink_archive }}"

# ── Network ────────────────────────────────────────────
flink_jobmanager_host: lang34.delta.sbrf.ru
flink_jobmanager_rpc_port: 6123
flink_jobmanager_web_port: 8081

# ── Memory (override per-group or per-host as needed) ──
# JM: для batch с parallelism=300 нужен простор под job-graph-сериализацию +
# метаданные 300 task-ов; 12g хватает с запасом.
flink_jobmanager_memory: "30g"
flink_jobmanager_metaspace_size: "4g"
# TM: 5 нод × 2 TM/нода × 30 slots = 300 total slots. По 2 JVM на машину —
# чтобы full GC одного TM не блокировал работу второго.
#
# Ноды кластера имеют 754 GiB RAM каждая (free -h: 333 GiB free + 342 GiB
# evictable cache = ~633 GiB available). Раньше было запрошено 240g per host
# (2 × 120g), что недоутилизирует кластер. Расширяем до 560g per host
# (2 × 280g), оставляя ~194g на OS / page cache / overhead.
#
# Главное преимущество: огромный task-off-heap (120g на TM = 4g per reader-task
# при p=200/10TM=20task/TM, или 6g при p=150). Vortex/lance Arrow C Data
# Interface allocator может работать без OOM даже на 60s checkpoint с 18MB
# файлами. Параллельно managed=50g даёт sort-buffer для compaction.
#
# Расчёт 280g process =
#   ~90g task heap (с запасом для parquet/orc compactor)
#   + 50g managed (sort buffer для paimon)
#   + 120g task-off-heap (Arrow direct buffer pool, network buffers)
#   + 8g metaspace
#   + ~12g framework off-heap + JVM overhead
flink_taskmanager_memory: "280g"
flink_taskmanager_managed_size: "50g"
flink_taskmanager_metaspace_size: "8g"
flink_taskmanager_task_off_heap_size: "120g"
flink_taskmanager_slots: 30
# Сколько TM запускать на каждой ноде. Раньше было 1 (один TM × 60 slots),
# теперь 2 (по 30 slots каждый). Total slots на кластере остаётся 5 × 2 × 30 = 300.
flink_taskmanagers_per_host: 2

# ── Parallelism ────────────────────────────────────────
# 5 нод × 2 TM × 30 slots = 300 total slots — как раньше.
flink_parallelism_default: 300

# ── HA (выключено по умолчанию) ────────────────────────
flink_ha_enabled: false
flink_ha_zookeeper_quorum: ""
flink_ha_storage_dir: ""

# JAVA

flink_java_home: /usr/lib/jvm/java-17

# ── Logging ────────────────────────────────────────────
flink_log_dir: "{{ flink_home }}/log"

# ── Hadoop-uber JAR в lib/ (для нод без системного hadoop) ────
# lang33 в кластере без локального hadoop-установки. flink-s3-fs-hadoop плагин
# требует hadoop-common/hadoop-aws классы в classpath. На 34/36 они подтянуты
# через `export HADOOP_CLASSPATH=$(hadoop classpath)` в start.yml. На 33 этого
# нет — кладём flink-shaded-hadoop-2-uber в $FLINK_HOME/lib/ как self-contained
# источник hadoop-классов. Копируется на ВСЕ ноды (не мешает 34/36, на них
# classpath дополняется, но это не создаёт конфликтов).
flink_hadoop_uber_enabled: true
flink_hadoop_uber_version: "2.8.3-10.0"
flink_hadoop_uber_jar: "flink-shaded-hadoop-2-uber-{{ flink_hadoop_uber_version }}.jar"
flink_hadoop_uber_url: "https://repo1.maven.org/maven2/org/apache/flink/flink-shaded-hadoop-2-uber/{{ flink_hadoop_uber_version }}/{{ flink_hadoop_uber_jar }}"

# ── S3 (Ozone) ─────────────────────────────────────────
# Выставляет конфиг для flink-s3-fs-hadoop и env для vortex native writer.
# Включается переопределением flink_s3_enabled=true через -e или group_vars.
flink_s3_enabled: false
flink_s3_endpoint: ""
flink_s3_access_key: ""
flink_s3_secret_key: ""
flink_s3_path_style_access: true

# ── Hadoop FS delegation tokens ────────────────────────
# Flink пытается на старте JM получить HDFS delegation token. При упавшем NameNode
# это висит в retry и JM не стартует. Для S3-only workload токены HDFS не нужны.
flink_hadoopfs_token_enabled: false

# ── Extra flink-conf.yaml entries (dict) ───────────────
# S3A HTTP connection pool tuning. Дефолтные 48 connections не выдерживают
# 240+60 parallel task-ов делающих одновременные S3 ops (parquet/orc писатель +
# reader-snapshot + background compaction). Симптом: ConnectionPoolTimeoutException
# при concurrent writer + reader на cluster. Vortex/Lance не страдают (свой
# Rust-object_store pool), но parquet/orc — да.
# Префикс s3.* — flink-s3-fs-hadoop плагин мапит в fs.s3a.*.
flink_extra_config:
  s3.connection.maximum: 2000      # default 48
  s3.threads.max: 200              # default 10 — multipart upload threads
  s3.max.total.tasks: 200          # default 5  — async tasks queue
  s3.attempts.maximum: 20          # default 20 — flaky-S3 retry
