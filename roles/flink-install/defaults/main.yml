# ── Paths ──────────────────────────────────────────────
flink_base_dir: /opt/flink-ivkochkozharov
flink_version: "2.2.0"
flink_home: "{{ flink_base_dir }}/flink-{{ flink_version }}"
flink_archive: "flink-{{ flink_version }}-bin-scala_2.12.tgz"
flink_archive_src: "{{ playbook_dir }}/../files/{{ flink_archive }}"

# ── Network ────────────────────────────────────────────
flink_jobmanager_host: lang34.delta.sbrf.ru
flink_jobmanager_rpc_port: 6123
flink_jobmanager_web_port: 8081

# ── Memory (override per-group or per-host as needed) ──
# JM: для batch с parallelism=300 нужен простор под job-graph-сериализацию +
# метаданные 300 task-ов; 12g хватает с запасом.
flink_jobmanager_memory: "12288m"
# TM: 60 слотов × ~1.6g/slot = 96g. С 300 total-слотов на 5 TM-ах это корректно
# распределяет нагрузку. Если на ноде меньше 128g RAM — снижай.
# 128g process — даёт место под увеличенный off-heap (16g) + managed (40g) +
# network (~13g по fraction) + metaspace (2g) + task-heap (~50g).
# Если RAM ноды меньше 160 — снижай process и managed пропорционально.
flink_taskmanager_memory: "131072m"
# Managed память для hash join / sort buffer / paimon sort-write. При TPC-DS
# без этого — spill-loop часами. 40g = ~40% от process.size (выше дефолтной
# фракции 0.4 чуть-чуть, но явно задано чтобы не сломалось при тюнинге).
flink_taskmanager_managed_size: "40g"
flink_taskmanager_metaspace_size: "2g"
# Vortex/arrow direct memory + batch shuffle с 60 слотами + interleaved
# прогон 3 форматов (каждый slot держит открытые paimon+arrow readers по всем
# каталогам сразу) = огромный direct pool. Ночной прогон TPC-DS упал по
# "Cannot reserve 4194304 bytes of direct buffer memory (limit: ~14GB)" —
# netty-pool упирался в 4g + 9.6g network = 13.6g. Ставим 16g чтобы с
# запасом переварить 60-slot interleaved-режим.
flink_taskmanager_task_off_heap_size: "16g"
flink_taskmanager_slots: 60

# ── Parallelism ────────────────────────────────────────
# 5 TM × 60 slots = 300 total slots → job с -p 300 забивает кластер полностью.
flink_parallelism_default: 300

# ── HA (выключено по умолчанию) ────────────────────────
flink_ha_enabled: false
flink_ha_zookeeper_quorum: ""
flink_ha_storage_dir: ""

# JAVA

flink_java_home: /usr/lib/jvm/java-17

# ── Logging ────────────────────────────────────────────
flink_log_dir: "{{ flink_home }}/log"

# ── Hadoop-uber JAR в lib/ (для нод без системного hadoop) ────
# lang33 в кластере без локального hadoop-установки. flink-s3-fs-hadoop плагин
# требует hadoop-common/hadoop-aws классы в classpath. На 34/36 они подтянуты
# через `export HADOOP_CLASSPATH=$(hadoop classpath)` в start.yml. На 33 этого
# нет — кладём flink-shaded-hadoop-2-uber в $FLINK_HOME/lib/ как self-contained
# источник hadoop-классов. Копируется на ВСЕ ноды (не мешает 34/36, на них
# classpath дополняется, но это не создаёт конфликтов).
flink_hadoop_uber_enabled: true
flink_hadoop_uber_version: "2.8.3-10.0"
flink_hadoop_uber_jar: "flink-shaded-hadoop-2-uber-{{ flink_hadoop_uber_version }}.jar"
flink_hadoop_uber_url: "https://repo1.maven.org/maven2/org/apache/flink/flink-shaded-hadoop-2-uber/{{ flink_hadoop_uber_version }}/{{ flink_hadoop_uber_jar }}"

# ── S3 (Ozone) ─────────────────────────────────────────
# Выставляет конфиг для flink-s3-fs-hadoop и env для vortex native writer.
# Включается переопределением flink_s3_enabled=true через -e или group_vars.
flink_s3_enabled: false
flink_s3_endpoint: ""
flink_s3_access_key: ""
flink_s3_secret_key: ""
flink_s3_path_style_access: true

# ── Hadoop FS delegation tokens ────────────────────────
# Flink пытается на старте JM получить HDFS delegation token. При упавшем NameNode
# это висит в retry и JM не стартует. Для S3-only workload токены HDFS не нужны.
flink_hadoopfs_token_enabled: false

# ── Extra flink-conf.yaml entries (dict) ───────────────
flink_extra_config: {}
