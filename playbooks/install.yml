---
# ============================================================
#  install.yml — распаковка дистрибутива и раскладка конфигов
# ============================================================
- name: Install Flink on all cluster nodes
  hosts: flink_cluster
  gather_facts: true
  roles:
    - flink-install

# ── Hadoop: автодетект + uber JAR где нет нативного Hadoop ──
- name: Setup Hadoop dependencies
  import_playbook: setup-hadoop.yml
