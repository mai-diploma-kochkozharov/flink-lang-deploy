---
# ============================================================
#  config-update.yml — обновление конфигов без переустановки
#
#  Использование:
#    # Только раскладка конфигов (без рестарта):
#    ansible-playbook playbooks/config-update.yml
#
#    # Раскладка + rolling-restart:
#    ansible-playbook playbooks/config-update.yml -e restart=true
#
#    # Переопределить параметры:
#    ansible-playbook playbooks/config-update.yml \
#      -e flink_taskmanager_memory=16384m \
#      -e flink_taskmanager_slots=8 \
#      -e restart=true
# ============================================================

#- import_playbook: krb-renew.yml
- name: Update Flink configuration on all nodes
  hosts: flink_cluster
  gather_facts: false
  vars:
    flink_home: /opt/flink-ivkochkozharov/flink-2.2.0
    restart: false
  roles:
    - role: flink-install
      flink_install_tasks: config_only    # роль всё равно отработает полностью,
                                          # но idempotent-шаги не изменят ничего

  post_tasks:
    - name: Show diff summary
      debug:
        msg: >
          Config deployed to {{ inventory_hostname }}.
          {% if restart | bool %}Restart will follow.{% else %}
          Run with -e restart=true to apply via rolling restart.{% endif %}

- name: Restart JobManager (if requested)
  hosts: jobmanager
  gather_facts: false
  vars:
    flink_home: /opt/flink-ivkochkozharov/flink-2.2.0
    restart: false
  tasks:
    - name: Restart JobManager
      shell: |
        export FLINK_HOME={{ flink_home }}
        export HADOOP_CLASSPATH=$(hadoop classpath)
        {% if flink_s3_enabled | default(false) | bool %}
        export AWS_ENDPOINT='{{ flink_s3_endpoint }}'
        export AWS_ACCESS_KEY_ID='{{ flink_s3_access_key }}'
        export AWS_SECRET_ACCESS_KEY='{{ flink_s3_secret_key }}'
        export AWS_ALLOW_HTTP='true'
        export RUST_LOG='info,object_store=debug,vortex=debug'
        export RUST_BACKTRACE='full'
        {% endif %}
        {{ flink_home }}/bin/jobmanager.sh stop || true
        sleep 1
        {{ flink_home }}/bin/jobmanager.sh start
      when: restart | bool

    - name: Wait for JobManager REST API
      uri:
        url: "http://{{ inventory_hostname }}:8081/overview"
        status_code: 200
      register: jm_health
      retries: 30
      delay: 2
      until: jm_health.status == 200
      when: restart | bool

- name: Rolling restart TaskManagers (if requested)
  hosts: taskmanagers
  gather_facts: false
  serial: 1
  vars:
    flink_home: /opt/flink-ivkochkozharov/flink-2.2.0
    restart: false
    # ВАЖНО: defaults роли flink-install видны только в play, где роль
    # импортирована. Эта play (Rolling restart) роль НЕ грузит, поэтому
    # переменную дублируем тут. Можно переопределить через `-e`.
    flink_taskmanagers_per_host: 2
  tasks:
    - name: Restart TaskManagers (учитываем flink_taskmanagers_per_host)
      # При flink_taskmanagers_per_host=2 на хосте две JVM TaskExecutor-а.
      # taskmanager.sh stop останавливает по одному инстансу за вызов, поэтому
      # вызываем stop N раз, потом start N раз, где N = target число TM-ов.
      shell: |
        export FLINK_HOME={{ flink_home }}
        # На lang33 нет системного hadoop → `hadoop classpath` падает.
        # Conditional: ставим HADOOP_CLASSPATH только если hadoop есть в PATH.
        if command -v hadoop >/dev/null 2>&1; then
          export HADOOP_CLASSPATH=$(hadoop classpath)
        else
          export HADOOP_CLASSPATH=""
        fi
        {% if flink_s3_enabled | default(false) | bool %}
        export AWS_ENDPOINT='{{ flink_s3_endpoint }}'
        export AWS_ACCESS_KEY_ID='{{ flink_s3_access_key }}'
        export AWS_SECRET_ACCESS_KEY='{{ flink_s3_secret_key }}'
        export AWS_ALLOW_HTTP='true'
        export RUST_LOG='info,object_store=debug,vortex=debug'
        export RUST_BACKTRACE='full'
        {% endif %}
        N={{ flink_taskmanagers_per_host | int }}
        echo "Stopping all $N TaskManager(s) on $(hostname)..."
        for i in $(seq 1 $N); do
          {{ flink_home }}/bin/taskmanager.sh stop || true
        done
        # finalize: pkill -f 'TaskManagerRunner' матчит сам shell ansible-обёртки
        # (строка 'TaskManagerRunner' встречается в cmdline текущего процесса) и
        # SIGTERM-ит его. Используем [T] regex-trick чтобы паттерн не матчил
        # свой собственный буквальный текст.
        pkill -f 'org\.apache\.flink\.runtime\.taskexecutor\.[T]askManagerRunner' || true
        sleep 2
        echo "Starting $N TaskManager(s)..."
        for i in $(seq 1 $N); do
          nohup {{ flink_home }}/bin/taskmanager.sh start > /dev/null 2>&1
        done
      when: restart | bool

    - name: Wait for TaskManagers to register
      pause:
        seconds: 5
      when: restart | bool
