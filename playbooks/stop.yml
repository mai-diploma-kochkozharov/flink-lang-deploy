---
# ============================================================
#  stop.yml — остановка кластера Flink
#    0) SQL Gateway на JM-хосте
#    1) Сначала TaskManagers на всех хостах
#    2) Затем JobManager на lang33
# ============================================================

- name: Stop SQL Gateway
  hosts: jobmanager
  gather_facts: false
  vars:
    flink_home: /opt/flink-ivkochkozharov/flink-2.2.0
  tasks:
    - name: Stop SQL Gateway
      shell: |
        {{ flink_home }}/bin/sql-gateway.sh stop || true
      register: gw_stop
      changed_when: "'Stopping' in gw_stop.stdout"

    - name: Check if SQL Gateway is still running
      shell: |
        ps -ef | grep -v grep | grep 'org.apache.flink.table.gateway.SqlGateway' || true
      register: gw_check
      changed_when: false

    - name: Force-kill SQL Gateway if still running
      shell: |
        pkill -f 'org.apache.flink.table.gateway.SqlGateway' || true
      when: gw_check.stdout != ""
      changed_when: false
      failed_when: false


- name: Stop TaskManagers
  hosts: taskmanagers
  gather_facts: false
  vars:
    flink_home: /opt/flink-ivkochkozharov/flink-2.2.0
    # ВАЖНО: defaults роли не подтягиваются здесь (роль не импортирована).
    # Дублируем дефолт. Если хост был запущен с другим N, передай через `-e`.
    flink_taskmanagers_per_host: 2
  tasks:
    - name: Stop TaskManagers (вызываем stop столько раз, сколько TM на хосте)
      # taskmanager.sh stop останавливает по одному инстансу за вызов.
      # Зацикливаем по числу запущенных, чтобы остановить все.
      shell: |
        for i in $(seq 1 {{ flink_taskmanagers_per_host | default(1) | int }}); do
          {{ flink_home }}/bin/taskmanager.sh stop || true
        done
      register: tm_stop
      changed_when: "'Stopping' in tm_stop.stdout"

    - name: Verify TaskManager stopped
      shell: |
        ps aux | grep -v grep | grep 'TaskManagerRunner' || true
      register: tm_check
      changed_when: false

    - name: Force-kill TaskManager if still running
      shell: |
        pkill -f 'TaskManagerRunner' || true
      when: tm_check.stdout != ""

    - name: TaskManager stopped
      debug:
        msg: "TaskManager stopped on {{ inventory_hostname }}"


- name: Stop JobManager
  hosts: jobmanager
  gather_facts: false
  vars:
    flink_home: /opt/flink-ivkochkozharov/flink-2.2.0
  tasks:
    - name: Stop JobManager
      shell: |
        {{ flink_home }}/bin/jobmanager.sh stop || true
      register: jm_stop
      changed_when: "'Stopping' in jm_stop.stdout"

    - name: Verify JobManager stopped
      shell: |
        ps aux | grep -v grep | grep 'StandaloneSessionClusterEntrypoint' || true
      register: jm_check
      changed_when: false

    - name: Force-kill JobManager if still running
      shell: |
        pkill -f 'StandaloneSessionClusterEntrypoint' || true
      when: jm_check.stdout != ""

    - name: JobManager stopped
      debug:
        msg: "JobManager stopped on {{ inventory_hostname }}"
