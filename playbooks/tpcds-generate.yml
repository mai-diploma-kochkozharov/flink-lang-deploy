---
# ============================================================
#  tpcds-generate.yml — локальная генерация TPC-DS через
#  dsdgen на lang36, организация файлов по таблицам, прямой
#  upload на S3 (Ozone). HDFS не используется.
#
#  Источник бинарника — ververica/tpc-ds-generators (pre-built
#  dsdgen_linux + tpcds.idx). Интернет нужен ТОЛЬКО на локальной
#  машине — ноды получат файлы через ansible copy.
#
#  Параметры:
#    tpcds_scale        — масштаб в GB. Default: 100.
#    tpcds_parallel     — число параллельных dsdgen-процессов. Default: 16.
#    tpcds_s3_bucket    — бакет. Default: paimon-b2c.
#    tpcds_s3_prefix    — префикс. Default: tpcds-{{ scale }}-raw.
#    tpcds_datagen_host — хост-генератор. Default: lang36.delta.sbrf.ru.
#
#  S3-доступ:
#    flink_s3_endpoint, flink_s3_access_key, flink_s3_secret_key
#
#  Пример:
#    ansible-playbook playbooks/tpcds-generate.yml \
#      -e tpcds_scale=100 \
#      -e flink_s3_endpoint=http://tpgds-rowan0001.delta.sbrf.ru:8333 \
#      -e flink_s3_access_key=access_key2 \
#      -e flink_s3_secret_key=secret_key2
#
#  Идемпотентность:
#    - Генерация пропускается если /opt/flink-ivkochkozharov/tpcds-data/<scale>/.generation-complete уже есть.
#    - Upload идёт через `hadoop fs -put -f` (перезатирает). Для пропуска загрузки используй
#      --skip-tags upload.
#
#  Итоговый layout на S3:
#    s3a://paimon-b2c/tpcds-100-raw/
#      store_sales/store_sales_1_16.dat ...
#      catalog_sales/...
#      customer/...
#      (все 24 таблицы TPC-DS)
# ============================================================

#- import_playbook: krb-renew.yml

# ──────────────────────────────────────────────────────────
#  Phase 0: качаем dsdgen_linux + tpcds.idx на контроллер
# ──────────────────────────────────────────────────────────
- name: Download TPC-DS generator binaries to controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # URL-ы и MD5 из flink-end-to-end-tests/flink-tpcds-test/tpcds-tool/data_generator.sh
    dsdgen_linux_url: https://raw.githubusercontent.com/ververica/tpc-ds-generators/f5d6c11681637908ce15d697ae683676a5383641/generators/dsdgen_linux
    tpcds_idx_url: https://raw.githubusercontent.com/ververica/tpc-ds-generators/f5d6c11681637908ce15d697ae683676a5383641/generators/tpcds.idx
    _files_dir: "{{ playbook_dir }}/../files"
  tags: download
  tasks:
    - name: Ensure files/ exists
      file:
        path: "{{ _files_dir }}"
        state: directory
        mode: "0755"

    - name: Download dsdgen_linux
      get_url:
        url: "{{ dsdgen_linux_url }}"
        dest: "{{ _files_dir }}/dsdgen_linux"
        mode: "0755"
        checksum: "md5:299216f04d490a154f632b0b9b842241"

    - name: Download tpcds.idx
      get_url:
        url: "{{ tpcds_idx_url }}"
        dest: "{{ _files_dir }}/tpcds.idx"
        mode: "0644"
        checksum: "md5:376152c9aa150c59a386b148f954c47d"

    # mc — minio client. Один статический Go-бинарник, S3-совместимый,
    # без python-зависимостей. Используем вместо hadoop fs для заливки,
    # т.к. hadoop fs ломается об Ozone DIROBJ-семантику.
    - name: Download mc (minio client) linux-amd64
      get_url:
        url: https://dl.min.io/client/mc/release/linux-amd64/mc
        dest: "{{ _files_dir }}/mc"
        mode: "0755"


# ──────────────────────────────────────────────────────────
#  Phase 1: генерация + upload на S3
# ──────────────────────────────────────────────────────────
- name: Generate TPC-DS CSV on lang36 and upload to S3
  hosts: "{{ tpcds_datagen_host | default('lang36.delta.sbrf.ru') }}"
  gather_facts: false
  vars:
    tpcds_scale: 100
    # Ноды lang34/lang36 — 80 CPU. 32 процесса dsdgen = нормальная загрузка
    # без переусердствования (context switching / I/O contention). Можно
    # поднять до 48-64 если нужна быстрая генерация и диски тянут.
    tpcds_parallel: 32
    tpcds_s3_bucket: paimon-b2c
    tpcds_s3_prefix: "tpcds-{{ tpcds_scale }}-raw"
    _tpcds_dir: /opt/flink-ivkochkozharov/tpcds-data
    _raw_subdir: "{{ _tpcds_dir }}/{{ tpcds_scale }}"
    _s3_target: "s3a://{{ tpcds_s3_bucket }}/{{ tpcds_s3_prefix }}"
    _tpcds_tables:
      - store_sales
      - store_returns
      - catalog_sales
      - catalog_returns
      - web_sales
      - web_returns
      - inventory
      - call_center
      - catalog_page
      - customer
      - customer_address
      - customer_demographics
      - date_dim
      - household_demographics
      - income_band
      - item
      - promotion
      - reason
      - ship_mode
      - store
      - time_dim
      - warehouse
      - web_page
      - web_site
  tasks:

    # ── Раскладка dsdgen и рабочей директории ──
    - name: Ensure tpcds-data directory exists
      file:
        path: "{{ _raw_subdir }}"
        state: directory
        mode: "0755"
      tags: [generate, upload]

    - name: Upload dsdgen_linux binary
      copy:
        src: "{{ playbook_dir }}/../files/dsdgen_linux"
        dest: "{{ _tpcds_dir }}/dsdgen_linux"
        mode: "0755"
      tags: [generate]

    - name: Upload tpcds.idx (ДОЛЖЕН лежать рядом с бинарником)
      copy:
        src: "{{ playbook_dir }}/../files/tpcds.idx"
        dest: "{{ _tpcds_dir }}/tpcds.idx"
        mode: "0644"
      tags: [generate]

    # ── Генерация ──
    - name: Check if generation already complete
      stat:
        path: "{{ _raw_subdir }}/.generation-complete"
      register: _gen_marker
      tags: [generate]

    - name: Generate TPC-DS scale {{ tpcds_scale }}GB (dsdgen -PARALLEL {{ tpcds_parallel }})
      shell: |
        set -euo pipefail
        cd {{ _tpcds_dir }}
        # Запускаем N процессов с разными CHILD, каждый пишет свой чанк.
        # dsdgen имя выходного файла — "<table>_<child>_<parallel>.dat".
        for i in $(seq 1 {{ tpcds_parallel }}); do
          ./dsdgen_linux \
            -SCALE {{ tpcds_scale }} \
            -FORCE Y \
            -DIR {{ _raw_subdir }} \
            -PARALLEL {{ tpcds_parallel }} \
            -CHILD $i > {{ _raw_subdir }}/dsdgen_$i.log 2>&1 &
        done
        wait
        touch {{ _raw_subdir }}/.generation-complete
      when: not _gen_marker.stat.exists
      async: 14400    # 4 часа лимит (scale=100 обычно 20-40 мин)
      poll: 60
      tags: [generate]

    - name: Show generated data size
      shell: du -sh {{ _raw_subdir }}
      register: _raw_size
      changed_when: false
      tags: [generate, upload]

    - name: Report local data
      debug:
        msg: "Raw data: {{ _raw_size.stdout }} at {{ _raw_subdir }}"
      tags: [generate, upload]

    # ── Организация файлов по таблицам ──
    # Flink filesystem connector читает все файлы в path-директории.
    # dsdgen кладёт все .dat в один _raw_subdir/, нам нужно разнести по таблицам:
    # _raw_subdir/store_sales/store_sales_*_16.dat, и т.п.
    #
    # ВАЖНО: имена таблиц в TPC-DS префиксно коллизируют — customer vs
    # customer_demographics, store vs store_sales, catalog vs catalog_returns.
    # Naивный глоб ${table}_*.dat для короткого имени сгребает чужие файлы.
    # Фикс: extglob с точным паттерном `<table>_<число>_<число>.dat`.
    - name: Organize CSV into per-table subdirs
      shell: |
        set -euo pipefail
        shopt -s extglob nullglob
        cd {{ _raw_subdir }}
        for table in {{ _tpcds_tables | join(' ') }}; do
          mkdir -p ./$table
          # Паттерн: table_<digits>_<digits>.dat — матчит только child_parallel-ные
          # чанки именно этой таблицы, без захвата префиксно-более-длинных имён.
          for f in ${table}_+([0-9])_+([0-9]).dat; do
            mv -n "$f" "./$table/" || true
          done
        done
      args:
        executable: /bin/bash
      tags: [generate, upload]

    # ── Транскод customer: ISO-8859-1 → UTF-8 ──
    # dsdgen кладёт имена клиентов в ISO-8859-1 (Åsa, Peña, Renée), Flink
    # csv-reader падает CharConversionException (csv.ignore-parse-errors не
    # помогает — ошибка на уровне UTF8Reader, ДО парсера).
    # Остальные таблицы — чистые числа/ASCII, транскодить не нужно.
    - name: Transcode customer table from ISO-8859-1 to UTF-8 (in-place)
      shell: |
        set -euo pipefail
        cd {{ _raw_subdir }}/customer
        ls *.dat | xargs -P {{ tpcds_parallel }} -I {} sh -c '
          iconv -f ISO-8859-1 -t UTF-8 "{}" -o "{}.utf8" && mv "{}.utf8" "{}"
        '
      args:
        executable: /bin/bash
      tags: [generate, upload]

    # ── Загрузка на S3 через mc (minio client) ──
    # hadoop fs не работает с Ozone — S3A требует parent-directory и
    # ломается об DIROBJ-семантику Ozone. mc просто PUT-ит объекты.
    - name: Upload mc binary to datagen host
      copy:
        src: "{{ playbook_dir }}/../files/mc"
        dest: "{{ _tpcds_dir }}/mc"
        mode: "0755"
      tags: [upload]

    - name: Configure mc alias for Ozone S3
      shell: |
        set -euo pipefail
        {{ _tpcds_dir }}/mc alias set ozone \
          {{ flink_s3_endpoint }} \
          {{ flink_s3_access_key }} \
          {{ flink_s3_secret_key }} \
          --api s3v4 \
          --path on
      changed_when: false
      tags: [upload]

    - name: Upload CSV directories to S3 via mc mirror
      shell: |
        set -euo pipefail
        # mc mirror работает как rsync: уже загруженные файлы пропускает.
        # --overwrite заставит перезаписать если размер/mtime разошлись.
        for table in {{ _tpcds_tables | join(' ') }}; do
          if [ -d {{ _raw_subdir }}/$table ] && [ -n "$(ls -A {{ _raw_subdir }}/$table 2>/dev/null)" ]; then
            echo ">>> Uploading $table"
            {{ _tpcds_dir }}/mc mirror --overwrite \
              {{ _raw_subdir }}/$table/ \
              ozone/{{ tpcds_s3_bucket }}/{{ tpcds_s3_prefix }}/$table/
          fi
        done
      async: 14400
      poll: 60
      tags: [upload]

    # ── Проверка и отчёт ──
    - name: List S3 layout (top-level tables)
      shell: |
        {{ _tpcds_dir }}/mc ls ozone/{{ tpcds_s3_bucket }}/{{ tpcds_s3_prefix }}/
      register: _s3_listing
      changed_when: false
      tags: [upload]

    - name: Summary
      debug:
        msg: |
          ═══════════════════════════════════════════
           TPC-DS scale {{ tpcds_scale }} — готово
          ═══════════════════════════════════════════
          Local:   {{ _raw_subdir }}  ({{ _raw_size.stdout }})
          S3:      {{ _s3_target }}

          {{ _s3_listing.stdout }}
      tags: [upload]
