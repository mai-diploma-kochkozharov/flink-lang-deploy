---
# ============================================================
#  kill-job.yml — прибивает висящий flink CLI driver на JM-ноде.
#
#  Когда make submit-* запущено в attached mode и ansible прибит
#  Ctrl-C-ом, удалённый flink run (CliFrontend) остаётся висеть из-за
#  SSH ControlMaster-а и продолжает слать INSERT-ы. Эта playbook-а
#  идёт на JM-хост и убивает процесс.
#
#  Параметры:
#    kill_class     — точный main-класс (default: TpcdsBenchmarkJob).
#                     Матчится через `pgrep -f`.
#    kill_all       — true: прибить ЛЮБОЙ CliFrontend (все flink run-ы).
#
#  Примеры:
#    ansible-playbook playbooks/kill-job.yml
#    ansible-playbook playbooks/kill-job.yml -e kill_class=PaimonHdfsJob
#    ansible-playbook playbooks/kill-job.yml -e kill_all=true
# ============================================================

- name: Kill flink CLI driver on JobManager
  hosts: jobmanager
  gather_facts: false
  vars:
    kill_class: TpcdsBenchmarkJob
    kill_all: false
  tasks:
    # Матчим только java-процессы, чтобы pkill не прибил сам себя
    # (наш shell-аргумент `pkill -f CliFrontend` содержит строку CliFrontend
    # и self-matches без фильтра по процессу).
    - name: Find matching flink CLI processes
      shell: |
        set -o pipefail
        if [ "{{ kill_all | bool }}" = "True" ]; then
          pattern='java.*CliFrontend'
        else
          pattern='java.*{{ kill_class }}'
        fi
        pgrep -a -f "$pattern" || true
      register: _pids
      changed_when: false

    - name: Show what will be killed
      debug:
        msg: "{{ _pids.stdout if _pids.stdout else 'Nothing matches — no flink CLI process found.' }}"

    - name: Extract PIDs
      set_fact:
        _pid_list: "{{ _pids.stdout_lines | map('regex_search', '^(\\d+)', '\\1') | select('string') | list }}"
      when: _pids.stdout | length > 0

    - name: Send SIGTERM
      shell: "kill -TERM {{ _pid_list | join(' ') }}"
      when: _pids.stdout | length > 0
      changed_when: true

    - name: Wait 3s then SIGKILL if still alive
      shell: "sleep 3 && kill -KILL {{ _pid_list | join(' ') }} 2>/dev/null || true"
      when: _pids.stdout | length > 0
      changed_when: false
