---
# ============================================================
#  start.yml — запуск кластера Flink
#    0) Renew Kerberos тикетов на всех нодах (обязательно)
#    1) JobManager на lang33
#    2) TaskManager на всех 5 машинах
# ============================================================

- import_playbook: krb-renew.yml

- name: Start JobManager
  hosts: jobmanager
  gather_facts: false
  vars:
    flink_home: /opt/flink-ivkochkozharov/flink-2.2.0
  tasks:
    - name: Check if JobManager is already running
      shell: |
        ps aux | grep -v grep | grep 'StandaloneSessionClusterEntrypoint' || true
      register: jm_status
      changed_when: false

    - name: Start JobManager process
      shell: |
        export FLINK_HOME={{ flink_home }}
        export HADOOP_CLASSPATH=$(hadoop classpath)
        nohup {{ flink_home }}/bin/jobmanager.sh start > /dev/null 2>&1
      when: jm_status.stdout == ""

    - name: Wait for JobManager REST API
      uri:
        url: "http://{{ inventory_hostname }}:8081/overview"
        status_code: 200
      register: jm_health
      retries: 30
      delay: 2
      until: jm_health.status == 200

    - name: JobManager is up
      debug:
        msg: "JobManager started on {{ inventory_hostname }} — Web UI at http://{{ inventory_hostname }}:8081"


- name: Start TaskManagers
  hosts: taskmanagers
  gather_facts: false
  serial: 1                         # стартуем по одному, чтобы не перегружать JM
  vars:
    flink_home: /opt/flink-ivkochkozharov/flink-2.2.0
  tasks:
    - name: Check if TaskManager is already running
      shell: |
        ps aux | grep -v grep | grep 'TaskManagerRunner' || true
      register: tm_status
      changed_when: false

    - name: Start TaskManager process
      shell: |
        export FLINK_HOME={{ flink_home }}
        export HADOOP_CLASSPATH=$(hadoop classpath)
        nohup {{ flink_home }}/bin/taskmanager.sh start > /dev/null 2>&1
      when: tm_status.stdout == ""

    - name: Wait for TaskManager to register
      pause:
        seconds: 5
      when: tm_status.stdout == ""

    - name: TaskManager started
      debug:
        msg: "TaskManager started on {{ inventory_hostname }}"


- name: Start SQL Gateway
  hosts: jobmanager
  gather_facts: false
  vars:
    flink_home: /opt/flink-ivkochkozharov/flink-2.2.0
    sql_gateway_port: 8083
  tasks:
    - name: Check if SQL Gateway is already running
      shell: |
        ps aux | grep -v grep | grep 'SqlGateway' || true
      register: gw_status
      changed_when: false

    - name: Start SQL Gateway process
      shell: |
        export FLINK_HOME={{ flink_home }}
        export HADOOP_CLASSPATH=$(hadoop classpath)
        nohup {{ flink_home }}/bin/sql-gateway.sh start \
          -Dsql-gateway.endpoint.rest.address=0.0.0.0 \
          -Dsql-gateway.endpoint.rest.port={{ sql_gateway_port }} \
          > /dev/null 2>&1
      when: gw_status.stdout == ""

    - name: Wait for SQL Gateway REST API
      uri:
        url: "http://{{ inventory_hostname }}:{{ sql_gateway_port }}/v1/info"
        status_code: 200
      register: gw_health
      retries: 15
      delay: 2
      until: gw_health.status == 200

    - name: SQL Gateway is up
      debug:
        msg: |
          SQL Gateway started on {{ inventory_hostname }}:{{ sql_gateway_port }}
          Для интерактивного TUI запусти локально:
            ./bin/sql-client.sh
